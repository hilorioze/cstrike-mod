on:
  push:
    branches: &branches
      - main

    paths: &paths
      - .github/workflows/build.yaml

      - src/**
      - CMakeLists.txt
      - dobby.nix

      # workflow reads `nixConfig` and builds `.#packages` against the pinned inputs, so changes to them may affect the result
      - flake.nix
      - flake.lock

  pull_request:
    branches: *branches

    paths: *paths

  workflow_dispatch:

jobs:
  build:
    concurrency:
      # one run per ref; latest cancels older runs
      group: ${{ github.workflow }}-${{ github.ref }}

      cancel-in-progress: true

    permissions:
      id-token: write # required so `niks3` can authenticate via OIDC
      contents: write # required for publishing releases

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hilorioze/nixos-dotfiles/.github/actions/setup-nix@main

      - uses: hilorioze/nixos-dotfiles/.github/actions/setup-niks3@main

      - id: build
        run: |
          result=$(nix build --no-link --print-out-paths --print-build-logs .#packages.i686-linux.default)

          {
            printf 'result=%s\n' $result

            if [[ ${{ github.event_name }} != pull_request ]]; then
              printf 'content_hash=%s\n' "$(nix hash path --type sha256 --base32 $result)"
            fi
          } >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.build.outputs.result }}/lib/libcstrike_mod.so

          archive: false

      - if: github.event_name != 'pull_request'
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ steps.build.outputs.content_hash }}
          commit: ${{ github.sha }} # pin release to the build commit

          artifacts: ${{ steps.build.outputs.result }}/lib/libcstrike_mod.so

          makeLatest: true
          skipIfReleaseExists: true
