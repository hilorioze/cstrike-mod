version: 2

updates:
  - package-ecosystem: github-actions

    directory: /

    schedule:
      # Run weekly on Mondays at 00:00 UTC
      interval: weekly
      time: "00:00"

    open-pull-requests-limit: 99 # disable the default limit of 5 PRs

    assignees:
      - hilorioze

    labels:
      - dependencies
      - github_actions
      - automated

    commit-message:
      prefix: chore(deps/github-actions)

  - package-ecosystem: nix

    directory: /

    schedule:
      # Run weekly on Mondays at 00:00 UTC
      interval: weekly
      time: "00:00"

    open-pull-requests-limit: 99 # disable the default limit of 5 PRs

    assignees:
      - hilorioze

    labels:
      - dependencies
      - nix
      - automated

    commit-message:
      prefix: chore(deps/nix)
